ro-inner{grid-template-columns:1fr}.hero-card{display:none}.fg{grid-template-columns:1fr 1fr}}@media(max-width:768px){.sidebar{display:none}.g4{grid-template-columns:repeat(2,1fr)}.fr{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect}=React;const STAGES=['Inquiry','Negotiating','Verbal Yes','Contract Sent','Contract Signed','Invoice Sent','Advance Pending','Paid','Cancelled'];const ECATS=['Equipment','Software & Subscriptions','Internet & Phone','Travel','Home Office','Professional Services','Other'];const PLAT=['YouTube','Instagram','Both','LinkedIn','Twitter/X','Podcast','Other'];const CATS=['Fashion','Tech','Food & Beverage','Travel','Lifestyle','Finance','Gaming','Beauty','Health','Other'];const SC={Inquiry:{bg:'#1e1e2e',text:'#a78bfa',border:'#6d28d9'},Negotiating:{bg:'#1a1e2e',text:'#60a5fa',border:'#1d4ed8'},'Verbal Yes':{bg:'#1a2230',text:'#38bdf8',border:'#0369a1'},'Contract Sent':{bg:'#1a2330',text:'#34d399',border:'#059669'},'Contract Signed':{bg:'#16263a',text:'#6ee7b7',border:'#047857'},'Invoice Sent':{bg:'#221a08',text:'#fcd34d',border:'#f59e0b'},'Advance Pending':{bg:'#2a1a08',text:'#fb923c',border:'#ea580c'},Paid:{bg:'#0f2218',text:'#4ade80',border:'#16a34a'},Cancelled:{bg:'#2a0a0a',text:'#f87171',border:'#dc2626'}};const fmt=(n,c='INR')=>{const v=Number(n)||0;return c==='USD'?'$'+v.toLocaleString('en-US',{maximumFractionDigits:0}):'₹'+v.toLocaleString('en-IN',{maximumFractionDigits:0})};const fd=d=>{if(!d)return'';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}catch{return d}};const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const A={getU:()=>{try{return JSON.parse(localStorage.getItem('co_u')||'[]')}catch{return[]}},saveU:u=>localStorage.setItem('co_u',JSON.stringify(u)),getSess:()=>{try{return JSON.parse(sessionStorage.getItem('co_s')||'null')}catch{return null}},setSess:u=>sessionStorage.setItem('co_s',JSON.stringify(u)),clearSess:()=>sessionStorage.removeItem('co_s'),getD:(uid,k)=>{try{return JSON.parse(localStorage.getItem('co_'+uid+'_'+k)||'[]')}catch{return[]}},setD:(uid,k,v)=>localStorage.setItem('co_'+uid+'_'+k,JSON.stringify(v)),hp:p=>btoa(p+'co26s')};function Bdg({l,sc}){const c=sc||{bg:'#1a1e2e',text:'#a9b4d0',border:'#2a3a5a'};return <span className='badge' style={{background:c.bg,color:c.text,borderColor:c.border}}>{l}</span>}function Mod({title,onClose,children}){return <div className='mo' onClick={e=>{if(e.target===e.currentTarget)onClose()}}><div className='md'><div className='mh'><span>{title}</span><button className='xb' onClick={onClose}>×</button></div>{children}</div></div>}function Landing({go}){return(<div><div className='hero'><div className='nav'><div className='nav-logo'>CreatorOps</div><div className='nav-btns'><button className='btn bg bsm' onClick={()=>go('login')}>Log in</button><button className='btn bp bsm' onClick={()=>go('signup')}>Get Started Free</button></div></div><div className='hero-inner'><div><div className='hero-tag'>✨ Built for Indian Creators</div><h1 className='hero-h1'>Your Creator<br/><span>Business OS.</span></h1><p className='hero-sub'>Track brand deals, invoices, and expenses — all in your own private workspace. No spreadsheets, no chaos.</p><div className='hero-btns'><button className='btn bp' style={{fontSize:15,padding:'12px 28px'}} onClick={()=>go('signup')}>Start Free →</button><button className='btn bg' onClick={()=>go('login')}>Already have an account?</button></div></div><div className='hero-card'><div className='hc-title'>💼 Live Deal Tracker</div><div className='deal-row'><div><div className='dn'>Nike India</div><div className='ds'>YouTube · Reel + Stories</div></div><div><Bdg l='Paid' sc={SC.Paid}/><div className='da'>₹50,000</div></div></div><div className='deal-row'><div><div className='dn'>Mamaearth</div><div className='ds'>Instagram · 2 Reels</div></div><div><Bdg l='Invoice Sent' sc={SC['Invoice Sent']}/
