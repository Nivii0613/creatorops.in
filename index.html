<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>CreatorOps — Manage brand deals, invoices, and payments</title><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0b1020;color:#f3f7ff;min-height:100vh}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#121933}::-webkit-scrollbar-thumb{background:#6ee7b7;border-radius:3px}.app{display:flex;height:100vh;overflow:hidden}.sidebar{width:220px;background:#121933;border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;flex-shrink:0}.sidebar-logo{padding:20px 16px;font-size:18px;font-weight:800;color:#6ee7b7;letter-spacing:-0.5px;border-bottom:1px solid rgba(255,255,255,0.08)}.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#a9b4d0;margin-bottom:2px;transition:all 0.15s}.nav-item:hover{background:#182244;color:#f3f7ff}.nav-item.active{background:rgba(110,231,183,0.12);color:#6ee7b7}.nav-icon{font-size:16px;width:20px;text-align:center}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.topbar{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;background:#121933}.topbar-title{font-size:18px;font-weight:700}.content{flex:1;overflow-y:auto;padding:24px}.card{background:#121933;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;margin-bottom:16px}.card-title{font-size:14px;font-weight:600;color:#a9b4d0;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px}.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}.btn-primary{background:#6ee7b7;color:#0b1020}.btn-primary:hover{background:#34d399}.btn-secondary{background:#182244;color:#f3f7ff;border:1px solid rgba(255,255,255,0.1)}.btn-secondary:hover{background:#1e2d5a}.btn-danger{background:#ef4444;color:#fff}.btn-sm{padding:6px 12px;font-size:12px}.input{width:100%;padding:9px 12px;background:#182244;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f3f7ff;font-size:13px;font-family:inherit;outline:none}.input:focus{border-color:#6ee7b7}.select{width:100%;padding:9px 12px;background:#182244;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f3f7ff;font-size:13px;font-family:inherit;outline:none;cursor:pointer}.select:focus{border-color:#6ee7b7}.label{display:block;font-size:12px;font-weight:600;color:#a9b4d0;margin-bottom:6px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.form-group{margin-bottom:12px}.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}.table{width:100%;border-collapse:collapse}.table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:#a9b4d0;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.08)}.table td{padding:12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle}.table tr:hover td{background:rgba(255,255,255,0.02)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal{background:#121933;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto}.modal-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}.close-btn{background:none;border:none;color:#a9b4d0;font-size:20px;cursor:pointer;padding:4px}.stat-card{background:#182244;border-radius:10px;padding:16px;text-align:center}.stat-value{font-size:22px;font-weight:800;color:#6ee7b7}.stat-label{font-size:11px;color:#a9b4d0;margin-top:4px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.empty{text-align:center;padding:48px 20px;color:#a9b4d0}.empty-icon{font-size:40px;margin-bottom:12px}.tabs{display:flex;gap:4px;margin-bottom:20px;background:#182244;padding:4px;border-radius:10px;width:fit-content}.tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:#a9b4d0;transition:all 0.15s}.tab.active{background:#6ee7b7;color:#0b1020;font-weight:700}textarea.input{resize:vertical;min-height:80px}@media(max-width:768px){.sidebar{display:none}.grid-4{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect,useMemo}=React;const STAGES=['Inquiry','Negotiating','Verbal Yes','Contract Sent','Contract Signed','Invoice Sent','Advance Pending','Paid','Cancelled'];const FU_STAGES=['Inquiry','Negotiating','Contract Sent','Invoice Sent','Advance Pending','Filming','Editing','Delivered','Paid','Cancelled'];const EXP_CATS=['Equipment','Software & Subscriptions','Internet & Phone','Travel','Home Office','Professional Services','Other'];const PLATFORMS=['YouTube','Instagram','Both','LinkedIn','Twitter/X','Podcast','Other'];const CATS=['Fashion','Tech','Food & Beverage','Travel','Lifestyle','Finance','Gaming','Beauty','Health','Other'];const SC={Inquiry:{bg:'#1e1e2e',text:'#a78bfa',border:'#6d28d9'},Negotiating:{bg:'#1a1e2e',text:'#60a5fa',border:'#1d4ed8'},'Verbal Yes':{bg:'#1a2230',text:'#38bdf8',border:'#0369a1'},'Contract Sent':{bg:'#1a2330',text:'#34d399',border:'#059669'},'Contract Signed':{bg:'#16263a',text:'#6ee7b7',border:'#047857'},'Invoice Sent':{bg:'#221a08',text:'#fcd34d',border:'#f59e0b'},'Advance Pending':{bg:'#2a1a08',text:'#fb923c',border:'#ea580c'},Paid:{bg:'#0f2218',text:'#4ade80',border:'#16a34a'},Cancelled:{bg:'#2a0a0a',text:'#f87171',border:'#dc2626'}};const fmt=(n,c='INR')=>{const v=Number(n)||0;return c==='USD'?'$'+v.toLocaleString('en-US',{maximumFractionDigits:0}):'₹'+v.toLocaleString('en-IN',{maximumFractionDigits:0})};const fmtDate=d=>{if(!d)return'';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}catch{return d}};const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const SEED_DEALS=[{id:'d1',brand:'Nike',platform:'YouTube',category:'Fashion',stage:'Paid',totalAmount:50000,advance:25000,currency:'INR',dueDate:'2026-01-15',deliverables:'1 Reel + Stories',notes:'Shoes review',createdAt:'2026-01-01'},{id:'d2',brand:'Mamaearth',platform:'Instagram',category:'Lifestyle',stage:'Invoice Sent',totalAmount:30000,advance:15000,currency:'INR',dueDate:'2026-02-20',deliverables:'2 Reels',notes:'Skincare range',createdAt:'2026-01-10'}];const SEED_EXP=[{id:'e1',title:'Adobe Creative Cloud',category:'Software & Subscriptions',amount:6000,currency:'INR',date:'2026-01-05',notes:'Annual plan'},{id:'e2',title:'Ring Light',category:'Equipment',amount:3500,currency:'INR',date:'2026-01-12',notes:'Studio upgrade'}];function useLS(key,def){const[v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):def}catch{return def}});useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v))}catch{}},[key,v]);return[v,setV]}function Badge({label,sc}){const c=sc||{bg:'#1a1e2e',text:'#a9b4d0',border:'#2a3a5a'};return <span className='badge' style={{background:c.bg,color:c.text,borderColor:c.border}}>{label}</span>}function Modal({title,onClose,children}){return <div className='modal-overlay' onClick={e=>{if(e.target===e.currentTarget)onClose()}}><div className='modal'><div className='modal-title'><span>{title}</span><button className='close-btn' onClick={onClose}>x</button></div>{children}</div></div>}function Dashboard({deals,expenses}){const paid=deals.filter(d=>d.stage==='Paid');const active=deals.filter(d=>d.stage!=='Paid'&&d.stage!=='Cancelled');const totalEarned=paid.reduce((s,d)=>s+(Number(d.totalAmount)||0),0);const totalExp=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);const pending=active.reduce((s,d)=>s+(Number(d.totalAmount)||0)-(Number(d.advance)||0),0);const thisMonth=paid.filter(d=>{const now=new Date();const dd=new Date(d.dueDate||d.createdAt);return dd.getMonth()===now.getMonth()&&dd.getFullYear()===now.getFullYear()}).reduce((s,d)=>s+(Number(d.totalAmount)||0),0);return(<div><div className='grid-4'><div className='stat-card'><div className='stat-value'>{fmt(totalEarned)}</div><div className='stat-label'>Total Earned</div></div><div className='stat-card'><div className='stat-value'>{active.length}</div><div className='stat-label'>Active Deals</div></div><div className='stat-card'><div className='stat-value'>{fmt(pending)}</div><div className='stat-label'>Pending Payment</div></div><div className='stat-card'><div className='stat-value'>{fmt(thisMonth)}</div><div className='stat-label'>This Month</div></div></div><div className='card'><div className='card-title'>Recent Deals</div>{deals.slice(0,5).map(d=>(<div key={d.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}}><div><div style={{fontWeight:600,fontSize:14}}>{d.brand}</div><div style={{fontSize:12,color:'#a9b4d0'}}>{d.platform} - {d.deliverables}</div></div><div style={{textAlign:'right'}}><Badge label={d.stage} sc={SC[d.stage]}/><div style={{fontSize:13,fontWeight:700,marginTop:4,color:'#6ee7b7'}}>{fmt(d.totalAmount,d.currency)}</div></div></div>))}{deals.length===0&&<div className='empty'><div className='empty-icon'>📭</div><div>No deals yet. Add your first deal!</div></div>}</div><div className='card'><div className='card-title'>Recent Expenses</div>{expenses.slice(0,5).map(e=>(<div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}}><div><div style={{fontWeight:600,fontSize:14}}>{e.title}</div><div style={{fontSize:12,color:'#a9b4d0'}}>{e.category} - {fmtDate(e.date)}</div></div><div style={{color:'#f87171',fontWeight:700}}>{fmt(e.amount,e.currency)}</div></div>))}{expenses.length===0&&<div style={{color:'#a9b4d0',fontSize:13,padding:'12px 0'}}>No expenses logged yet.</div>}</div></div>)}function DealForm({deal,onSave,onClose}){const init=deal||{brand:'',platform:'YouTube',category:'Fashion',stage:'Inquiry',totalAmount:'',advance:'',currency:'INR',dueDate:'',deliverables:'',notes:''};const[f,setF]=useState(init);const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));return(<form onSubmit={e=>{e.preventDefault();onSave({...f,id:f.id||genId(),createdAt:f.createdAt||new Date().toISOString()})}}><div className='form-row'><div><label className='label'>Brand Name *</label><input className='input' value={f.brand} onChange={set('brand')} required placeholder='e.g. Nike'/></div><div><label className='label'>Platform</label><select className='select' value={f.platform} onChange={set('platform')}>{PLATFORMS.map(p=><option key={p}>{p}</option>)}</select></div></div><div className='form-row'><div><label className='label'>Category</label><select className='select' value={f.category} onChange={set('category')}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div><div><label className='label'>Stage</label><select className='select' value={f.stage} onChange={set('stage')}>{STAGES.map(s=><option key={s}>{s}</option>)}</select></div></div><div className='form-row'><div><label className='label'>Total Amount</label><input className='input' type='number' value={f.totalAmount} onChange={set('totalAmount')} placeholder='0'/></div><div><label className='label'>Advance Received</label><input className='input' type='number' value={f.advance} onChange={set('advance')} placeholder='0'/></div></div><div className='form-row'><div><label className='label'>Currency</label><select className='select' value={f.currency} onChange={set('currency')}><option value='INR'>INR (₹)</option><option value='USD'>USD ($)</option></select></div><div><label className='label'>Due Date</label><input className='input' type='date' value={f.dueDate} onChange={set('dueDate')}/></div></div><div className='form-group'><label className='label'>Deliverables</label><input className='input' value={f.deliverables} onChange={set('deliverables')} placeholder='e.g. 1 Reel + 2 Stories'/></div><div className='form-group'><label className='label'>Notes</label><textarea className='input' value={f.notes} onChange={set('notes')} placeholder='Any notes about this deal...'></textarea></div><div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}><button type='button' className='btn btn-secondary' onClick={onClose}>Cancel</button><button type='submit' className='btn btn-primary'>{deal?'Update Deal':'Add Deal'}</button></div></form>)}function Deals({deals,setDeals}){const[show,setShow]=useState(false);const[edit,setEdit]=useState(null);const[filter,setFilter]=useState('All');const[search,setSearch]=useState('');const save=d=>{setDeals(p=>edit?p.map(x=>x.id===d.id?d:x):[d,...p]);setShow(false);setEdit(null)};const del=id=>{if(confirm('Delete this deal?'))setDeals(p=>p.filter(x=>x.id!==id))};const filtered=deals.filter(d=>(filter==='All'||d.stage===filter)&&(d.brand.toLowerCase().includes(search.toLowerCase())||d.platform.toLowerCase().includes(search.toLowerCase())));return(<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div style={{display:'flex',gap:8,alignItems:'center'}}><input className='input' style={{width:200}} placeholder='Search deals...' value={search} onChange={e=>setSearch(e.target.value)}/><select className='select' style={{width:160}} value={filter} onChange={e=>setFilter(e.target.value)}><option>All</option>{STAGES.map(s=><option key={s}>{s}</option>)}</select></div><button className='btn btn-primary' onClick={()=>{setEdit(null);setShow(true)}}>+ Add Deal</button></div><div className='card' style={{padding:0,overflow:'hidden'}}><table className='table'><thead><tr><th>Brand</th><th>Platform</th><th>Stage</th><th>Total</th><th>Advance</th><th>Due</th><th>Actions</th></tr></thead><tbody>{filtered.map(d=>(<tr key={d.id}><td><div style={{fontWeight:600}}>{d.brand}</div><div style={{fontSize:11,color:'#a9b4d0'}}>{d.deliverables}</div></td><td style={{color:'#a9b4d0'}}>{d.platform}</td><td><Badge label={d.stage} sc={SC[d.stage]}/></td><td style={{fontWeight:700,color:'#6ee7b7'}}>{fmt(d.totalAmount,d.currency)}</td><td style={{color:'#a9b4d0'}}>{fmt(d.advance,d.currency)}</td><td style={{color:'#a9b4d0',fontSize:12}}>{fmtDate(d.dueDate)}</td><td><div style={{display:'flex',gap:4}}><button className='btn btn-secondary btn-sm' onClick={()=>{setEdit(d);setShow(true)}}>✏️</button><button className='btn btn-danger btn-sm' onClick={()=>del(d.id)}>🗑</button></div></td></tr>))}</tbody></table>{filtered.length===0&&<div className='empty'><div className='empty-icon'>📭</div><div>{search||filter!=='All'?'No deals match your filter.':'No deals yet. Add your first deal!'}</div></div>}</div>{show&&<Modal title={edit?'Edit Deal':'New Deal'} onClose={()=>{setShow(false);setEdit(null)}}><DealForm deal={edit} onSave={save} onClose={()=>{setShow(false);setEdit(null)}}/></Modal>}</div>)}function Expenses({expenses,setExpenses}){const[show,setShow]=useState(false);const[edit,setEdit]=useState(null);const[f,setF]=useState({title:'',category:'Equipment',amount:'',currency:'INR',date:'',notes:''});const openAdd=()=>{setF({title:'',category:'Equipment',amount:'',currency:'INR',date:'',notes:''});setEdit(null);setShow(true)};const openEdit=e=>{setF(e);setEdit(e);setShow(true)};const set=k=>ev=>setF(p=>({...p,[k]:ev.target.value}));const save=ev=>{ev.preventDefault();const exp={...f,id:f.id||genId()};setExpenses(p=>edit?p.map(x=>x.id===exp.id?exp:x):[exp,...p]);setShow(false)};const del=id=>{if(confirm('Delete expense?'))setExpenses(p=>p.filter(x=>x.id!==id))};const total=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);const bycat=EXP_CATS.map(c=>({cat:c,amt:expenses.filter(e=>e.category===c).reduce((s,e)=>s+(Number(e.amount)||0),0)})).filter(x=>x.amt>0);return(<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div className='stat-card' style={{display:'inline-block',padding:'10px 20px'}}><span style={{color:'#a9b4d0',fontSize:12}}>Total Expenses: </span><span style={{color:'#f87171',fontWeight:800,fontSize:18}}>{fmt(total)}</span></div><button className='btn btn-primary' onClick={openAdd}>+ Log Expense</button></div>{bycat.length>0&&<div className='card'><div className='card-title'>By Category</div><div className='grid-3'>{bycat.map(x=><div key={x.cat} className='stat-card'><div style={{fontSize:11,color:'#a9b4d0',marginBottom:4}}>{x.cat}</div><div style={{color:'#f87171',fontWeight:700}}>{fmt(x.amt)}</div></div>)}</div></div>}<div className='card' style={{padding:0,overflow:'hidden'}}><table className='table'><thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Actions</th></tr></thead><tbody>{expenses.map(e=>(<tr key={e.id}><td><div style={{fontWeight:600}}>{e.title}</div>{e.notes&&<div style={{fontSize:11,color:'#a9b4d0'}}>{e.notes}</div>}</td><td style={{color:'#a9b4d0'}}>{e.category}</td><td style={{color:'#f87171',fontWeight:700}}>{fmt(e.amount,e.currency)}</td><td style={{color:'#a9b4d0',fontSize:12}}>{fmtDate(e.date)}</td><td><div style={{display:'flex',gap:4}}><button className='btn btn-secondary btn-sm' onClick={()=>openEdit(e)}>✏️</button><button className='btn btn-danger btn-sm' onClick={()=>del(e.id)}>🗑</button></div></td></tr>))}</tbody></table>{expenses.length===0&&<div className='empty'><div className='empty-icon'>💸</div><div>No expenses logged yet.</div></div>}</div>{show&&<Modal title={edit?'Edit Expense':'Log Expense'} onClose={()=>setShow(false)}><form onSubmit={save}><div className='form-row'><div><label className='label'>Title *</label><input className='input' value={f.title} onChange={set('title')} required placeholder='e.g. Adobe CC'/></div><div><label className='label'>Category</label><select className='select' value={f.category} onChange={set('category')}>{EXP_CATS.map(c=><option key={c}>{c}</option>)}</select></div></div><div className='form-row'><div><label className='label'>Amount</label><input className='input' type='number' value={f.amount} onChange={set('amount')} placeholder='0'/></div><div><label className='label'>Currency</label><select className='select' value={f.currency} onChange={set('currency')}><option value='INR'>INR</option><option value='USD'>USD</option></select></div></div><div className='form-group'><label className='label'>Date</label><input className='input' type='date' value={f.date} onChange={set('date')}/></div><div className='form-group'><label className='label'>Notes</label><textarea className='input' value={f.notes} onChange={set('notes')} placeholder='Optional notes'></textarea></div><div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}><button type='button' className='btn btn-secondary' onClick={()=>setShow(false)}>Cancel</button><button type='submit' className='btn btn-primary'>{edit?'Update':'Save'}</button></div></form></Modal>}</div>)}function Invoices({deals}){const invoiceable=deals.filter(d=>['Contract Signed','Invoice Sent','Advance Pending','Paid'].includes(d.stage));return(<div><div className='card'><div className='card-title'>Invoice Summary</div>{invoiceable.length===0&&<div className='empty'><div className='empty-icon'>📱</div><div>No deals at invoice stage yet.</div></div>}{invoiceable.map(d=>{const balance=(Number(d.totalAmount)||0)-(Number(d.advance)||0);return(<div key={d.id} style={{padding:'16px 0',borderBottom:'1px solid rgba(255,255,255,0.06)'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}><div><div style={{fontWeight:700,fontSize:15}}>{d.brand}</div><div style={{fontSize:12,color:'#a9b4d0'}}>{d.platform} - {d.deliverables}</div></div><Badge label={d.stage} sc={SC[d.stage]}/></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:8}}><div style={{background:'#182244',borderRadius:8,padding:'8px 12px'}}><div style={{fontSize:11,color:'#a9b4d0'}}>Total</div><div style={{fontWeight:700,color:'#6ee7b7'}}>{fmt(d.totalAmount,d.currency)}</div></div><div style={{background:'#182244',borderRadius:8,padding:'8px 12px'}}><div style={{fontSize:11,color:'#a9b4d0'}}>Advance</div><div style={{fontWeight:700,color:'#fcd34d'}}>{fmt(d.advance,d.currency)}</div></div><div style={{background:'#182244',borderRadius:8,padding:'8px 12px'}}><div style={{fontSize:11,color:'#a9b4d0'}}>Balance</div><div style={{fontWeight:700,color:balance>0?'#f87171':'#4ade80'}}>{fmt(balance,d.currency)}</div></div></div>{d.dueDate&&<div style={{marginTop:8,fontSize:12,color:'#a9b4d0'}}>Due: {fmtDate(d.dueDate)}</div>}</div>)})}</div></div>)}function Analytics({deals,expenses}){const byPlatform=PLATFORMS.map(p=>({name:p,value:deals.filter(d=>d.platform===p).reduce((s,d)=>s+(Number(d.totalAmount)||0),0)})).filter(x=>x.value>0);const byCat=CATS.map(c=>({name:c,value:deals.filter(d=>d.category===c).reduce((s,d)=>s+(Number(d.totalAmount)||0),0)})).filter(x=>x.value>0);const byStage=STAGES.map(s=>({name:s,count:deals.filter(d=>d.stage===s).length})).filter(x=>x.count>0);const totalRev=deals.filter(d=>d.stage==='Paid').reduce((s,d)=>s+(Number(d.totalAmount)||0),0);const totalExp=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);return(<div><div className='grid-4'><div className='stat-card'><div className='stat-value'>{deals.length}</div><div className='stat-label'>Total Deals</div></div><div className='stat-card'><div className='stat-value'>{fmt(totalRev)}</div><div className='stat-label'>Revenue</div></div><div className='stat-card'><div className='stat-value' style={{color:'#f87171'}}>{fmt(totalExp)}</div><div className='stat-label'>Expenses</div></div><div className='stat-card'><div className='stat-value' style={{color:totalRev-totalExp>=0?'#4ade80':'#f87171'}}>{fmt(totalRev-totalExp)}</div><div className='stat-label'>Net Income</div></div></div><div className='card'><div className='card-title'>Deals by Platform</div><div className='grid-3'>{byPlatform.map(x=><div key={x.name} className='stat-card'><div style={{fontSize:12,color:'#a9b4d0',marginBottom:4}}>{x.name}</div><div style={{fontWeight:700,color:'#6ee7b7'}}>{fmt(x.value)}</div></div>)}{byPlatform.length===0&&<div style={{color:'#a9b4d0'}}>No data yet</div>}</div></div><div className='card'><div className='card-title'>Pipeline by Stage</div>{byStage.map(x=><div key={x.name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:13}}>{x.name}</span><span style={{fontWeight:700,color:'#6ee7b7'}}>{x.count} deal{x.count!==1?'s':''}</span></div>)}{byStage.length===0&&<div style={{color:'#a9b4d0'}}>No data yet</div>}</div></div>)}const NAV=[{id:'dashboard',label:'Dashboard',icon:'🏠'},{id:'deals',label:'Deals',icon:'🤝'},{id:'invoices',label:'Invoices',icon:'💳'},{id:'expenses',label:'Expenses',icon:'💸'},{id:'analytics',label:'Analytics',icon:'📊'}];function App(){const[deals,setDeals]=useLS('co_deals',SEED_DEALS);const[expenses,setExpenses]=useLS('co_expenses',SEED_EXP);const[page,setPage]=useState('dashboard');return(<div className='app'><div className='sidebar'><div className='sidebar-logo'
