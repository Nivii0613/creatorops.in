<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CreatorOps — Deal & Invoice Manager</title>
<meta name="description" content="Manage brand deals, invoices, expenses and payments in one place."/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#080810;color:#f0f0f0;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a14}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:3px}

/* Layout */
#root{display:flex;flex-direction:column;min-height:100vh}
.app-shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#0d0d1a;border-right:1px solid #1e1e2e;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sidebar-brand{padding:20px 18px 16px;border-bottom:1px solid #1a1a2e;display:flex;align-items:center;gap:10px}
.sidebar-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6d28d9,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.sidebar-name{font-size:15px;font-weight:700;color:#f0f0f0;letter-spacing:-0.3px}
.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;color:#555;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#888;background:rgba(255,255,255,.02)}
.nav-item.active{color:#a78bfa;background:rgba(109,40,217,.08);border-left-color:#6d28d9}
.nav-item .ni{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:#6d28d9;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.main-content{flex:1;overflow-y:auto;padding:24px;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar-title{font-size:20px;font-weight:700;color:#f0f0f0;letter-spacing:-.4px}
.topbar-sub{font-size:12px;color:#444;margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:#6d28d9;color:#fff}
.btn-primary:hover{background:#7c3aed}
.btn-secondary{background:#0e0e1a;border:1px solid #2a2a3a;color:#888}
.btn-secondary:hover{color:#ccc;border-color:#3a3a4a}
.btn-danger{background:none;border:1px solid #3a1a1a;color:#f87171}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-ghost{background:none;border:none;color:#555;padding:4px 8px;font-size:16px}
.btn-ghost:hover{color:#888}

/* Inputs */
.inp{width:100%;padding:8px 11px;background:#0e0e1a;border:1px solid #2a2a3a;border-radius:8px;color:#f0f0f0;font-size:13px;outline:none}
.inp:focus{border-color:#6d28d9}
.inp::placeholder{color:#333}
.label{font-size:11px;color:#555;margin-bottom:4px;display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-field{margin-bottom:10px}
.textarea{resize:vertical;min-height:64px}

/* Cards */
.card{background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:11px;color:#444;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}

/* Stats */
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-card{flex:1;min-width:110px;background:#0d0d1a;border:1px solid #1e1e2e;border-radius:10px;padding:12px 14px}
.stat-label{font-size:11px;color:#444;margin-bottom:4px}
.stat-value{font-size:19px;font-weight:700;color:#f0f0f0}
.stat-sub{font-size:10px;color:#333;margin-top:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}

/* Deal List */
.deal-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #0e0e18;cursor:pointer;transition:background .1s}
.deal-item:hover{background:#0f0f1e}
.deal-item:last-child{border-bottom:none}
.deal-avatar{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.deal-main{flex:1;min-width:0}
.deal-brand{font-size:13px;font-weight:600;color:#f0f0f0}
.deal-meta{font-size:11px;color:#444;margin-top:2px}
.deal-right{text-align:right;flex-shrink:0}
.deal-amount{font-size:13px;font-weight:600;color:#a78bfa}
.deal-status{margin-top:3px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#0d0d1a;border:1px solid #2a2a3a;border-radius:16px;padding:24px;width:520px;max-width:100%;max-height:92vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:15px;font-weight:700;color:#f0f0f0}
.modal-close{background:none;border:none;color:#555;font-size:22px;cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:#888}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:#444}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:.25}
.empty-title{font-size:14px;font-weight:600;color:#555;margin-bottom:6px}
.empty-sub{font-size:12px;color:#333;margin-bottom:16px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid #1a1a2e;padding-bottom:0}
.tab{padding:8px 14px;font-size:13px;color:#444;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:#a78bfa;border-bottom-color:#6d28d9}
.tab:hover:not(.active){color:#666}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kb-col{min-width:220px;background:#0d0d1a;border:1px solid #1a1a2e;border-radius:12px;padding:12px;flex-shrink:0}
.kb-col-header{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kb-card{background:#080810;border:1px solid #1e1e2e;border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer}
.kb-card:hover{border-color:#2a2a3a}

/* Misc */
.divider{border:none;border-top:1px solid #1a1a2e;margin:12px 0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #1a1a2e;background:#0a0a12;color:#555}
.pill.on{background:#1a1a2e;border-color:#3a2a5e;color:#a78bfa}
.autocomplete{position:absolute;top:100%;left:0;right:0;background:#0d0d1a;border:1px solid #2a2a3a;border-radius:8px;z-index:20;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.7)}
.autocomplete-item{padding:8px 12px;font-size:13px;color:#888;cursor:pointer}
.autocomplete-item:hover{background:#0f0f1e;color:#f0f0f0}

/* Priority */
.p-high{background:#1e1010;color:#f87171;border:1px solid #dc2626;border-radius:4px;font-size:9px;font-weight:700;padding:1px 5px}
.p-low{color:#555;font-size:9px;font-weight:600;padding:1px 5px}

/* Mobile nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0d0d1a;border-top:1px solid #1a1a2e;z-index:100;padding:6px 0 8px}
.mobile-nav-items{display:flex;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#444;cursor:pointer;padding:4px 8px;border-radius:8px}
.mobile-nav-item.active{color:#a78bfa}
.mobile-nav-item .mni{font-size:20px}

/* Invoice preview */
.inv-preview{font-family:Arial,sans-serif;background:#fff;color:#111;border-radius:8px;padding:24px;font-size:13px}

/* Chart bar */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin:8px 0}
.chart-bar{flex:1;background:#6d28d9;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.chart-bar:hover{background:#7c3aed}
.chart-labels{display:flex;gap:4px}
.chart-label{flex:1;text-align:center;font-size:9px;color:#444}

@media(max-width:768px){
  .sidebar{display:none}
  .mobile-nav{display:block}
  .main-content{padding:16px;padding-bottom:80px}
  .form-row{grid-template-columns:1fr}
  .stat-row{gap:8px}
  .stat-card{min-width:calc(50% - 4
